<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu documento — TrámiteFácil AI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root {
    --bg: #f7f8fb;
    --card: #ffffff;
    --ink: #1a1f36;
    --muted: #5c6478;
    --accent: #2451ff;
    --accent-dark: #1638c9;
    --border: #e3e6ef;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    padding: 24px 20px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  .brand { font-weight: 800; color: var(--accent); }
  main { max-width: 760px; margin: 0 auto; padding: 32px 20px 80px; }

  #state-loading, #state-error { text-align: center; padding: 60px 20px; color: var(--muted); }
  #state-error { display: none; color: #a8071a; }

  #state-ready { display: none; }
  .actions { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  button.cta, a.cta {
    background: var(--accent); color: white; border: none; padding: 12px 18px;
    border-radius: 10px; font-size: 0.95rem; font-weight: 700; cursor: pointer;
    text-decoration: none; display: inline-block;
  }
  button.cta:hover, a.cta:hover { background: var(--accent-dark); }
  button.secondary { background: white; color: var(--ink); border: 1.5px solid var(--border); }
  button.secondary:hover { border-color: var(--accent); }

  #docContainer {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 40px;
  }
  #docBody {
    white-space: pre-wrap;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 0.98rem;
    line-height: 1.7;
  }

  .spinner {
    width: 34px; height: 34px; border: 3px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; margin: 0 auto 16px; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="brand">✦ TrámiteFácil AI</div>
</header>

<main>
  <div id="state-loading">
    <div class="spinner"></div>
    <p>Generando tu documento con IA, puede tardar unos segundos...</p>
  </div>

  <div id="state-error">
    <p id="errorMsg">Ocurrió un error.</p>
    <a class="cta" href="/">Volver al inicio</a>
  </div>

  <div id="state-ready">
    <div class="actions">
      <button class="cta" id="downloadBtn">Descargar PDF</button>
      <button class="cta secondary" id="copyBtn">Copiar texto</button>
      <a class="cta secondary" href="/">Generar otro documento</a>
    </div>
    <div id="docContainer">
      <div id="docBody"></div>
    </div>
  </div>
</main>

<script>
function qs(name) {
  return new URLSearchParams(window.location.search).get(name);
}

async function fetchDocument() {
  const demo = qs('demo');
  const params = new URLSearchParams();
  if (demo === '1') {
    params.set('demo', '1');
    params.set('payload', qs('payload') || '');
  } else {
    const sessionId = qs('session_id');
    if (!sessionId) {
      showError('Falta información de la sesión de pago.');
      return;
    }
    params.set('session_id', sessionId);
  }

  try {
    const res = await fetch('/api/generate?' + params.toString());
    const data = await res.json();
    if (!res.ok) {
      showError(data.error || 'No se pudo generar el documento.');
      return;
    }
    showDocument(data.docLabel, data.text);
  } catch (err) {
    showError('No se pudo conectar con el servidor.');
  }
}

function showError(msg) {
  document.getElementById('state-loading').style.display = 'none';
  document.getElementById('state-error').style.display = 'block';
  document.getElementById('errorMsg').textContent = msg;
}

function showDocument(label, text) {
  document.getElementById('state-loading').style.display = 'none';
  document.getElementById('state-ready').style.display = 'block';
  document.title = label + ' — TrámiteFácil AI';
  document.getElementById('docBody').textContent = text;

  document.getElementById('downloadBtn').addEventListener('click', () => {
    const el = document.getElementById('docContainer');
    html2pdf().set({
      margin: 15,
      filename: label.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.pdf',
      html2canvas: { scale: 2 },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
    }).from(el).save();
  });

  document.getElementById('copyBtn').addEventListener('click', () => {
    navigator.clipboard.writeText(text);
    const btn = document.getElementById('copyBtn');
    const original = btn.textContent;
    btn.textContent = 'Copiado ✓';
    setTimeout(() => { btn.textContent = original; }, 1500);
  });
}

fetchDocument();
</script>

</body>
</html>
